<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris Dixon · Digital strategy, AI &amp; web projects</title>
<meta name="description" content="Chris Dixon is a digital strategist and builder in Lancaster, UK. Notes on AI and digital strategy, GitHub projects, and more.">
<meta property="og:title" content="Chris Dixon">
<meta property="og:description" content="Digital strategy · AI &amp; automation · Web projects. Lancaster, UK.">
<meta property="og:url" content="https://chrisdixon.net/">
<meta name="theme-color" content="#cdeae2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 10v13L16 30 3 23V10z' fill='%23b9e2d7'/%3E%3Cpath d='M16 3 29 10 16 17 3 10z' fill='%23e2f4ee'/%3E%3Cpath d='M12 26V19a4 4 0 0 1 8 0v7z' fill='%232b5559'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b5559; --ink-soft:#4f7f7f; --sand:#f5e8cc; --coral:#e07a5f; --coral-deep:#c9644a;
    --serif:'Cormorant Garamond', Georgia, serif; --sans:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:linear-gradient(180deg,#c9e8df 0%,#e2f3ec 40%,#f6eedb 78%,#f3e6cc 100%);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  #scene{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

  /* ---------- title ---------- */
  .title{position:fixed;top:clamp(14px,4.5vh,44px);left:0;right:0;text-align:center;pointer-events:none;z-index:2}
  .title h1{
    font-family:var(--serif);font-weight:500;text-transform:uppercase;margin:0;
    font-size:clamp(24px,3.4vw,42px);letter-spacing:.42em;padding-left:.42em;line-height:1.1;
  }
  .title p{margin:.55em 0 0;font-size:clamp(10.5px,1.05vw,13.5px);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .title .rule{display:block;width:64px;height:1px;background:currentColor;opacity:.35;margin:.9em auto 0}

  /* ---------- door labels ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .door-label{
    position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
    text-align:center;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:10px;
    transition:transform .25s ease, background .25s ease;white-space:nowrap;
  }
  .door-label .name{
    display:flex;align-items:center;justify-content:center;gap:.5em;
    font-family:var(--serif);font-weight:600;text-transform:uppercase;
    font-size:clamp(13px,1.55vw,20px);letter-spacing:.32em;padding-left:.32em;
  }
  .door-label .sub{display:block;font-size:clamp(9.5px,.85vw,11.5px);letter-spacing:.12em;opacity:.72;margin-top:2px}
  .door-label .gem{width:7px;height:7px;border-radius:50%;background:#9cbfba;flex:none;transition:background .3s, box-shadow .3s}
  .door-label.ready .gem{background:var(--coral);box-shadow:0 0 0 4px rgba(224,122,95,.22)}
  .door-label:hover,.door-label:focus-visible{background:rgba(255,251,242,.6)}
  .door-label.place-side{transform:translate(-100%,-50%);text-align:right}
  .door-label.place-side .name{justify-content:flex-end}
  .door-label.place-sideR{transform:translate(0,-50%);text-align:left}
  .door-label.place-sideR .name{justify-content:flex-start}
  .door-label:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  body.narrow .door-label{padding:4px 6px}
  body.narrow .door-label.align-right{transform:translate(-92%,-100%);text-align:right}
  body.narrow .door-label.align-right .name{justify-content:flex-end}
  body.narrow .door-label.align-left{transform:translate(-14%,-100%);text-align:left}
  body.narrow .door-label.align-left .name{justify-content:flex-start}
  body.narrow .door-label .name{letter-spacing:.22em;padding-left:.22em}

  /* ---------- hint bar ---------- */
  .hintbar{
    position:fixed;left:50%;transform:translateX(-50%);z-index:4;
    bottom:calc(44px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);
    background:rgba(255,251,242,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding:7px 7px 7px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(43,85,89,.12);
  }
  #hint{margin:0;font-size:clamp(12px,1.1vw,14px);line-height:1.35;transition:opacity .25s}
  .turn{
    flex:none;border:0;background:var(--coral);color:#fff;border-radius:999px;cursor:pointer;
    font:500 13px/1 var(--sans);letter-spacing:.06em;padding:9px 14px;display:flex;gap:6px;align-items:center;
    transition:background .2s, transform .2s;
  }
  .turn:hover{background:var(--coral-deep)}
  .turn:active{transform:scale(.96)}
  .turn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .turn svg{width:15px;height:15px}

  /* ---------- plain links (always available) ---------- */
  nav.plain{
    position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;
    text-align:center;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);
  }
  nav.plain a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(43,85,89,.3);margin:0 .35em}
  nav.plain a:hover{border-color:var(--coral);color:var(--coral-deep)}

  /* ---------- svg bits ---------- */
  .hit{fill:transparent;cursor:pointer}
  .tt-hit{fill:transparent;cursor:grab}
  body.dragging, body.dragging .tt-hit{cursor:grabbing}
  .door-glow{opacity:0;transition:opacity .6s ease}
  .door.ready .door-glow{opacity:.5;animation:breathe 2.6s ease-in-out infinite}
  .door.open .door-glow{opacity:1;animation:none}
  .door-halo{opacity:0;transition:opacity .6s ease}
  .door.open .door-halo{opacity:.9}
  @keyframes breathe{0%,100%{opacity:.32}50%{opacity:.7}}
  .knob{transform-box:fill-box;transform-origin:center}
  .knob.pulse{animation:pulse 1.1s ease-in-out 3}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.55)}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 5s ease-in-out infinite}
  @keyframes ripple{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
  .shimmer{animation:shimmer 4s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:0}50%{opacity:.75}}
  .cloud{animation:drift 70s ease-in-out infinite alternate}
  .cloud.slow{animation-duration:110s}
  @keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
  .float{animation:bob 7s ease-in-out infinite}
  .float.b{animation-duration:9s;animation-delay:-3s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .lamp{animation:flicker 3.4s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.55}45%{opacity:.85}60%{opacity:.7}}
  #walker .body{animation:idle 2.8s ease-in-out infinite}
  #walker.moving .body{animation:none}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8px)}}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:600px){
    .hintbar{padding-left:14px;gap:8px;bottom:calc(40px + env(safe-area-inset-bottom))}
    .turn{padding:8px 11px}
    .turn span{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div id="stage">
  <svg id="scene" viewBox="-390 -500 920 830" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b7e3da"/><stop offset="1" stop-color="#6fbdb4"/>
      </linearGradient>
      <linearGradient id="colGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ead2a8"/><stop offset=".55" stop-color="#dcc095"/><stop offset="1" stop-color="#c4a272"/>
      </linearGradient>
      <linearGradient id="ttSide" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f0b291"/><stop offset=".55" stop-color="#e49a77"/><stop offset="1" stop-color="#cc7c58"/>
      </linearGradient>
      <radialGradient id="domeGrad" cx=".35" cy=".3" r=".85">
        <stop offset="0" stop-color="#7fb9b2"/><stop offset=".6" stop-color="#4b8c88"/><stop offset="1" stop-color="#33696a"/>
      </radialGradient>
      <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#ffe2a0"/>
      </linearGradient>
      <radialGradient id="halo">
        <stop offset="0" stop-color="#fff3c6" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c6" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="mist">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="bg"></g>
    <g id="world"></g>
    <g id="actor"></g>
    <g id="fg"></g>
    <g id="hits"></g>
  </svg>
</div>

<header class="title">
  <h1>Chris Dixon</h1>
  <p>Digital strategy · AI &amp; automation · Web projects</p>
  <span class="rule"></span>
</header>

<div id="labels"></div>

<div class="hintbar">
  <p id="hint" aria-live="polite">Choose a door. Turn the platform to open its path.</p>
  <button class="turn" id="turnBtn" type="button" aria-label="Turn the platform a quarter turn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    <span>Turn</span>
  </button>
</div>

<nav class="plain" aria-label="Site sections">
  Direct route:
  <a href="https://notes.chrisdixon.net">Notes</a>·<a href="projects/index.html">Projects</a>·<a href="about/index.html">About</a>·<a href="https://github.com/egonspengler24">GitHub</a>
</nav>

<script>
(() => {
  'use strict';
  /* ================= projection & helpers ================= */
  const T = 40, TH = 20, ZK = 38;               // tile half-width, half-height, height per unit
  const WZ = -4.6;                               // water level
  const P = (x, y, z) => [(x - y) * T, (x + y) * TH - z * ZK];
  const NS = 'http://www.w3.org/2000/svg';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = document.getElementById('scene');
  const L = id => document.getElementById(id);
  const layers = { bg: L('bg'), world: L('world'), actor: L('actor'), fg: L('fg'), hits: L('hits') };

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  function poly(g, a, fill, extra) {
    return el('polygon', Object.assign({ points: pts(a), fill, stroke: fill, 'stroke-width': 0.7, 'stroke-linejoin': 'round' }, extra || {}), g);
  }
  function line(g, a, b, stroke, w, extra) {
    return el('line', Object.assign({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke, 'stroke-width': w, 'stroke-linecap': 'round' }, extra || {}), g);
  }

  const PAL = {
    sand:     { top: '#f6e9ce', left: '#e9d0a4', right: '#d3b384' },
    sandDark: { top: '#efdcb6', left: '#ddc092', right: '#c5a273' },
    mint:     { top: '#e3f5ef', left: '#bce3d8', right: '#95ccc0' },
    deep:     { top: '#6aa8a2', left: '#4b8c88', right: '#36706d' },
    base:     { top: 'url(#water)', left: '#dcc394', right: '#c3a271' }
  };

  /* ================= drawable registry ================= */
  const drawables = [];
  const footprints = [];   // where things meet the water (for ripples)

  function boxFaces(g, b, pal, opt) {
    const [x0, x1, y0, y1, z0, z1] = b;
    poly(g, [P(x0, y1, z1), P(x1, y1, z1), P(x1, y1, z0), P(x0, y1, z0)], pal.left);
    poly(g, [P(x1, y0, z1), P(x1, y1, z1), P(x1, y1, z0), P(x1, y0, z0)], pal.right);
    poly(g, [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], pal.top);
    if (!opt || !opt.noEdge) {
      el('polyline', { points: pts([P(x0, y1, z1), P(x1, y1, z1), P(x1, y0, z1)]), fill: 'none', stroke: 'rgba(255,255,255,.45)', 'stroke-width': 1, 'stroke-linejoin': 'round' }, g);
    }
    if (opt && opt.bands) {
      for (const z of opt.bands) {
        poly(g, [P(x0, y1, z + .14), P(x1, y1, z + .14), P(x1, y1, z), P(x0, y1, z)], 'rgba(43,85,89,.07)', { stroke: 'none' });
        poly(g, [P(x1, y0, z + .14), P(x1, y1, z + .14), P(x1, y1, z), P(x1, y0, z)], 'rgba(43,85,89,.07)', { stroke: 'none' });
      }
    }
  }
  function box(b, pal, opt) {
    drawables.push({ b, draw: g => { boxFaces(g, b, pal, opt); if (opt && opt.deco) opt.deco(g); } });
    if (Math.abs(b[4] - WZ) < 1e-6) footprints.push(b);
  }
  function column(x0, x1, y0, y1, ztop, pal) { box([x0, x1, y0, y1, WZ, ztop], pal || PAL.sandDark, { bands: [ztop - 1.2] }); }
  function steps(axis, from, n, across, zStart, stepLen) {
    // axis 'x': stairs climbing toward -x ; axis 'y': climbing toward -y
    for (let i = 0; i < n; i++) {
      const a1 = from - stepLen * i, a0 = a1 - stepLen, top = zStart + 0.5 * (i + 1);
      const b = axis === 'x' ? [a0, a1, across[0], across[1], -0.4, top] : [across[0], across[1], a0, a1, -0.4, top];
      box(b, PAL.sand);
    }
  }
  function pyramid(x0, x1, y0, y1, z0, h, pal) {
    const apex = P((x0 + x1) / 2, (y0 + y1) / 2, z0 + h);
    drawables.push({ b: [x0, x1, y0, y1, z0, z0 + h], draw: g => {
      poly(g, [P(x0, y1, z0), P(x1, y1, z0), apex], pal.left);
      poly(g, [P(x1, y0, z0), P(x1, y1, z0), apex], pal.right);
      line(g, P(x1, y1, z0), apex, 'rgba(255,255,255,.35)', 1);
      const tip = [apex[0], apex[1] - 14];
      line(g, apex, tip, '#36706d', 2);
      el('circle', { cx: tip[0], cy: tip[1], r: 3.2, fill: '#e07a5f' }, g);
    }});
  }
  function dome(cx, cy, z0, r) {
    drawables.push({ b: [cx - r, cx + r, cy - r, cy + r, z0, z0 + r * 1.2], draw: g => {
      const [x, y] = P(cx, cy, z0), rx = Math.SQRT2 * r * T, ry = Math.SQRT2 * r * TH, rz = r * ZK * 1.25;
      el('path', { d: `M${x - rx},${y} A${rx},${ry} 0 0 0 ${x + rx},${y} A${rx},${rz} 0 0 0 ${x - rx},${y}Z`, fill: 'url(#domeGrad)' }, g);
      const top = [x, y - rz];
      line(g, top, [x, top[1] - 14], '#36706d', 2);
      el('circle', { cx: x, cy: top[1] - 14, r: 3.2, fill: '#e07a5f' }, g);
    }});
  }
  function tree(x, y, z0, s) {
    s = s || 1;
    drawables.push({ b: [x - .3, x + .3, y - .3, y + .3, z0, z0 + 1.6 * s], draw: g => {
      line(g, P(x, y, z0), P(x, y, z0 + .85 * s), '#a88456', 3);
      const [cx, cy] = P(x, y, z0 + 1.2 * s);
      el('circle', { cx, cy, r: 15 * s, fill: '#79bcae' }, g);
      el('circle', { cx: cx - 4 * s, cy: cy - 5 * s, r: 8 * s, fill: '#a3d6c8' }, g);
    }});
  }

  /* ================= doors ================= */
  const DIRS = { projects: 0, pier: Math.PI / 2, notes: Math.PI, about: Math.PI * 1.5 };
  const doors = {
    notes: {
      label: 'Notes', sub: 'Writing on AI & digital', url: 'https://notes.chrisdixon.net',
      face: 'x', fixed: -5, c: 0, zb: 1.5, glyph: 'book', anchor: [-5, -0.9, 4.0], anchorNarrow: [-5.8, 0, 7.3], place: 'sideR', narrow: 'left',
      tower: [-6.6, -5, -0.9, 0.9, WZ, 4.6], spireTop: 6.4,
      path: [[0, 0, 0], [-2.95, 0, 0], [-3.25, 0, .5], [-3.75, 0, 1], [-4.25, 0, 1.5], [-5, 0, 1.5], [-5.45, 0, 1.5]]
    },
    projects: {
      label: 'Projects', sub: "Things I've built", url: 'projects/index.html',
      face: 'y', fixed: -4.2, c: 4.5, zb: 3, glyph: 'cube', anchor: [4.5, -5, 8.3], place: 'above', narrow: 'right',
      tower: [3.7, 5.3, -5.8, -4.2, WZ, 5.6], spireTop: 7.4,
      path: [[0, 0, 0], [4.5, 0, 0], [4.5, -.55, 0], [4.5, -.85, .5], [4.5, -1.35, 1], [4.5, -1.85, 1.5], [4.5, -2.35, 2], [4.5, -2.85, 2.5], [4.5, -3.35, 3], [4.5, -4.2, 3], [4.5, -4.65, 3]]
    },
    about: {
      label: 'About', sub: 'Who I am', url: 'about/index.html',
      face: 'y', fixed: -5, c: 0, zb: 0, glyph: 'person', anchor: [-0.9, -5, 3.1], place: 'side', narrow: 'side',
      tower: [-0.9, 0.9, -6.6, -5, WZ, 3.4], spireTop: 4.9,
      path: [[0, 0, 0], [0, -5, 0], [0, -5.45, 0]]
    }
  };

  const faceFn = (face, fixed, c, zb) => face === 'x'
    ? (u, v) => P(fixed, c - u, zb + v)
    : (u, v) => P(c + u, fixed, zb + v);
  function archPts(w, h, n) {
    n = n || 16; const r = w / 2, out = [[-r, 0], [-r, h - r]];
    for (let i = 1; i < n; i++) { const t = Math.PI - Math.PI * i / n; out.push([r * Math.cos(t), h - r + r * Math.sin(t)]); }
    out.push([r, h - r], [r, 0]); return out;
  }
  function windowOn(g, face, fixed, c, zb, w, h) {
    const F = faceFn(face, fixed, c, zb);
    poly(g, archPts(w || .3, h || .62).map(([u, v]) => F(u, v)), '#3d6d70');
  }
  function glyph(g, F, kind) {
    const col = '#36706d', m = a => a.map(([u, v]) => F(u, v));
    if (kind === 'book') {
      poly(g, m([[-.36, 2.42], [-.04, 2.36], [-.04, 2.1], [-.36, 2.16]]), col);
      poly(g, m([[.36, 2.42], [.04, 2.36], [.04, 2.1], [.36, 2.16]]), col);
    } else if (kind === 'cube') {
      const c = [0, 2.3], r = .25, hex = [];
      for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; hex.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]); }
      el('polygon', { points: pts(m(hex)), fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
      for (const a of [Math.PI / 6, 5 * Math.PI / 6, 1.5 * Math.PI])
        line(g, F(c[0], c[1]), F(c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)), col, 2);
    } else {
      const head = []; for (let k = 0; k < 18; k++) { const a = k / 18 * Math.PI * 2; head.push([.1 * Math.cos(a), 2.44 + .1 * Math.sin(a)]); }
      poly(g, m(head), col);
      const sh = []; for (let k = 0; k <= 12; k++) { const a = k / 12 * Math.PI; sh.push([-.22 * Math.cos(a), 2.06 + .2 * Math.sin(a)]); }
      poly(g, m(sh), col);
    }
  }
  function doorDeco(id) {
    const d = doors[id];
    return g => {
      const F = faceFn(d.face, d.fixed, d.c, d.zb), m = a => a.map(([u, v]) => F(u, v));
      poly(g, m(archPts(1.36, 1.88)), '#f6e9ce');
      const dg = el('g', { class: 'door', id: 'door-' + id }, g);
      poly(dg, m(archPts(1, 1.6)), '#24474b');
      poly(dg, m(archPts(.62, 1.3)), '#1d3b3f', { stroke: 'none' });
      poly(dg, m(archPts(1, 1.6)), 'url(#glow)', { class: 'door-glow' });
      const [hx, hy] = F(0, .8);
      el('ellipse', { cx: hx, cy: hy, rx: 46, ry: 40, fill: 'url(#halo)', class: 'door-halo' }, dg);
      glyph(g, F, d.glyph);

      const a = path[i], b = path[i + 1];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1], (b[2] - a[2]) * .7);
      segs.push({ a, b, len, s: total }); total += len;
    }
    walking = true; walker.classList.add('moving');
    const speed = 3.1, t0 = performance.now();
    (function frame(now) {
      const dist = reduceMotion ? total : Math.min(total, (now - t0) / 1000 * speed);
      const sg = segs.find(s => dist <= s.s + s.len + 1e-9) || segs[segs.length - 1];
      const f = sg.len ? (dist - sg.s) / sg.len : 1;
      ch.x = sg.a[0] + (sg.b[0] - sg.a[0]) * f;
      ch.y = sg.a[1] + (sg.b[1] - sg.a[1]) * f;
      ch.z = sg.a[2] + (sg.b[2] - sg.a[2]) * f;
      const ax = P(...sg.a)[0], bx = P(...sg.b)[0];
      if (Math.abs(bx - ax) > 1) ch.face = bx > ax ? 1 : -1;
      const first = segs[0], last = segs[segs.length - 1];
      ch.op = 1;
      if (opts.fadeOut && dist > last.s) ch.op = Math.max(0, 1 - (dist - last.s) / last.len);
      if (opts.fadeIn && dist < first.len) ch.op = Math.max(0, dist / first.len);
      ch.swing = Math.sin(dist * 7.5) * 26;
      drawWalker();
      if (dist < total) requestAnimationFrame(frame);
      else { ch.swing = 0; drawWalker(); walking = false; walker.classList.remove('moving'); opts.done && opts.done(); }
    })(t0);
  }

  function go(url) { window.location.href = url; }
  function tryDoor(id, ev) {
    const d = doors[id];
    if (pendingNav) { go(pendingNav); return; }          // second tap while walking = skip ahead
    if (walking || rotating) return;
    if (alignedTo() !== id) {
      setHint(`The path to ${d.label} isn’t connected yet. Turn the platform to line it up.`);
      pulseKnob = true; renderTT();
      setTimeout(() => { pulseKnob = false; }, 3400);
      return;
    }
    pendingNav = d.url;
    d.g.classList.add('open');
    setHint(`Heading to ${d.label}…`);
    walk(d.path, { fadeOut: true, done: () => setTimeout(() => go(d.url), reduceMotion ? 0 : 260) });
  }

  // keep things consistent when returning via the back button (bfcache)
  window.addEventListener('pageshow', e => {
    if (!e.persisted) return;
    pendingNav = null; walking = false;
    for (const id in doors) doors[id].g.classList.remove('open');
    Object.assign(ch, { x: 0, y: 0, z: 0, op: 1, swing: 0 }); faceOpening(); refreshDoors(true);
  });

  /* ================= start ================= */
  const from = new URLSearchParams(location.search).get('from');
  if (from && doors[from]) {
    phi = DIRS[from];
    renderTT(); refreshDoors(false);
    const back = doors[from].path.slice().reverse();
    Object.assign(ch, { x: back[0][0], y: back[0][1], z: back[0][2], op: 0 });
    drawWalker();
    doors[from].g.classList.add('open');
    setHint('Welcome back.');
    setTimeout(() => {
      walk(back, { fadeIn: true, done: () => { doors[from].g.classList.remove('open'); faceOpening(); refreshDoors(true); } });
    }, reduceMotion ? 0 : 350);
    history.replaceState(null, '', location.pathname);
  } else {
    renderTT(); faceOpening(); refreshDoors(false);
    if (!reduceMotion) setTimeout(() => { if (!drag && !walking) { pulseKnob = true; renderTT(); setTimeout(() => { pulseKnob = false; }, 3400); } }, 1400);
  }
  placeLabels();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeLabels);
})();
</script>
</body>
